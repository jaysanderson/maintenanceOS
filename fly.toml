# fly.toml app configuration file generated for maintenanceos on 2026-05-18T13:07:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'maintenanceos'
primary_region = 'syd'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
