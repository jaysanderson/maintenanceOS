name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client + seed test DB
        working-directory: apps/api
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npx tsx prisma/seed.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: API tests
        run: npm run test
